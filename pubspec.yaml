  flutter_ringtone_manager: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  change_app_package_name: ^1.5.0

flutter:
  uses-material-design: true
  assets:
    - assets/
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/file_000000008fc872089268acc9b04e5bcf.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/file_000000008fc872089268acc9b04e5bcf.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  windows:
    generate: true
    image_path: "assets/file_000000008fc872089268acc9b04e5bcf.png"
  macos:
    generate: true
    image_path: "assets/file_000000008fc872089268acc9b04e5bcf.png"

dependency_overrides:
  sqflite_android: 2.4.1
