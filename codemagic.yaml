workflows:
  van1-ios-testflight:
    name: VanTalad Merchant iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: van_apple_connect
    environment:
      flutter: stable
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.vantalad.merchant
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install dependencies
        script: flutter pub get
      - name: Fetch iOS code signing files
        script: |
          app-store-connect fetch-signing-files "com.vantalad.merchant" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
      - name: Set up Xcode signing
        script: xcode-project use-profiles
      - name: Install CocoaPods
        script: |
          cd ios
          pod install
          cd ..
      - name: Build IPA
        script: flutter build ipa --release
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
