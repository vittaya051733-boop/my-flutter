<!DOCTYPE html><html><head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SHOP">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>SHOP</title>
  <link rel="manifest" href="manifest.json">
  
  
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
  
  
  
  
  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #ffffff;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
      window.clearTimeout(window._flutterLoaderTimeout);
      const loadError = document.getElementById("flutter-load-error");
      if (loadError) {
        loadError.remove();
      }
    }

    window.addEventListener("error", function (event) {
      const message = event?.message || "";
      if (!message.includes("flutter") && !message.includes("canvaskit")) {
        return;
      }
      showFlutterLoadError("โหลดแอปไม่สำเร็จ กรุณารีเฟรชหน้าเว็บ");
    });

    window._flutterLoaderTimeout = window.setTimeout(function () {
      if (!document.getElementById("splash")) {
        return;
      }
      showFlutterLoadError("โหลดนานผิดปกติ กรุณารีเฟรชหรือลอง Safari อีกครั้ง");
    }, 45000);

    function showFlutterLoadError(text) {
      if (document.getElementById("flutter-load-error")) {
        return;
      }
      const error = document.createElement("p");
      error.id = "flutter-load-error";
      error.textContent = text;
      error.style.cssText =
        "position:fixed;left:16px;right:16px;bottom:24px;margin:0;padding:12px 16px;border-radius:12px;background:#fff3e0;color:#5d4037;font:16px/1.4 sans-serif;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.12);z-index:9999;";
      document.body.appendChild(error);
    }
  </script>
</head>
<body>
  <picture id="splash">
      <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
      <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">
      <img class="center" aria-hidden="true" src="splash/img/light-1x.png" alt="">
  </picture>
  
  
  
  <script src="flutter_bootstrap.js" async=""></script>


</body></html>
